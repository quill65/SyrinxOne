steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "apps/web/Dockerfile"
      - "--build-arg"
      - "VITE_API_URL=${_VITE_API_URL}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/syrinx-web:latest"
      - "."

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/syrinx-web:latest"

substitutions:
  _REGION: "us-west1"
  _VITE_API_URL: "https://syrinx-engine-466330924576.us-west1.run.app"
