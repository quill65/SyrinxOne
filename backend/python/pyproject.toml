[project]
name = "syrinx-backend"
version = "0.1.0"
description = "SyrinxOne Python DSP, audio I/O, annotation, and pluggable storage backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "soundfile>=0.12.1",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
cloud = [
    "boto3>=1.35.0",
    "google-cloud-storage>=2.18.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syrinx_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
